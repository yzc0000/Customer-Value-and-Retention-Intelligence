[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-value-retention-intelligence"
version = "0.1.0"
description = "A time-aware retail customer value, segmentation, and retention portfolio"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3,<2.4",
    "pandas>=2.3,<2.4",
    "scipy>=1.16,<1.17",
    "scikit-learn>=1.8,<1.9",
    "openpyxl>=3.1,<3.2",
    "pyarrow>=22,<23",
    "joblib>=1.5,<1.6",
    "threadpoolctl>=3.6,<3.7",
    "xgboost>=3.1,<3.2",
    "torch>=2.10,<2.11",
    "streamlit>=1.52,<1.53",
    "matplotlib>=3.10,<3.11",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2.8"]
revenue-challengers = ["ngboost==0.5.11"]

[project.scripts]
customer-intelligence = "customer_intelligence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
